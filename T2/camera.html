<!DOCTYPE html>
<html>
  <head>
    <title>T2</title>

    <link rel="shortcut icon" href="../favicon.ico" />
    <link rel="stylesheet" href="../html/resources/default.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #blocker {
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.0);
        z-index: 100;
      }
      #instructions {
        min-width: 200px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2em;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        padding: 16px 32px;
      }
    </style>
  </head>

  <body>
    <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
    <script
      async
      src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      { "imports": { "three": "../build/three.module.js" } }
    </script>
    <div id="blocker">
      <div id="instructions">
        <p>(Click to continue)</p>
      </div>
    </div>

    <div id="webgl-output">
      <script type="module" src="camera.js"></script>
    </div>
    <div id="crosshair" style="display:none;position:fixed;top:50%;left:50%;width:32px;height:32px;z-index:200;pointer-events:none;transform:translate(-50%,-50%);">
      <svg width="32" height="32">
        <line x1="16" y1="8" x2="16" y2="24" stroke="black" stroke-width="2"/>
        <line x1="8" y1="16" x2="24" y2="16" stroke="black" stroke-width="2"/>
      </svg>
    </div>
  </body>
</html>
